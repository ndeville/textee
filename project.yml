name: Textee
options:
  bundleIdPrefix: com.nicolasdeville
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Textee:
    type: application
    platform: macOS
    sources:
      - path: TexteeMac/Sources
      - path: TexteeMac/Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: TexteeMac/Info.plist
      properties:
        CFBundleName: Textee
        CFBundleDisplayName: Textee
        CFBundleIconFile: AppIcon
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleURLTypes:
          - CFBundleURLName: com.nicolasdeville.textee
            CFBundleURLSchemes:
              - textee
        CFBundleDocumentTypes:
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.plain-text
          - CFBundleTypeName: Source Code
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.source-code
              - public.json
              - public.yaml
              - public.python-script
              - public.shell-script
              - public.script
              - net.daringfireball.markdown
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasdeville.textee
        PRODUCT_NAME: Textee
        # build.sh builds unsigned and signs afterwards (TEXTEE_SIGN_IDENTITY): no team in the project.
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        GCC_OPTIMIZATION_LEVEL: s
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          # Strip the symbols from the shipped binary (about 40% of it). The dSYM next to the build keeps
          # crash logs readable.
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
